<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Mahasiswa - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-mode="tambah">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">Sistem Informasi Akademik</span>
            <a href="dashboard.html" class="btn btn-light btn-sm">&laquo; Dashboard</a>
        </div>
    </nav>

    <main class="container my-4" style="max-width: 720px">
        <div class="card kartu">
            <div class="card-body p-4">
                <h4 class="mb-3">Tambah Mahasiswa</h4>
                <div id="pesan"></div>

                <!-- novalidate: validasi dikerjakan oleh form.js agar pesannya seragam -->
                <form id="form-mahasiswa" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="nim">NIM</label>
                        <input type="text" class="form-control" id="nim" name="nim" maxlength="9" placeholder="9 karakter, contoh 220100123">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="nama">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama" name="nama">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="prodi">Program Studi</label>
                        <input type="text" class="form-control" id="prodi" name="prodi" list="daftar-prodi">
                        <datalist id="daftar-prodi">
                            <option value="Teknik Informatika"><option value="Sistem Informasi"><option value="Teknik Komputer">
                        </datalist>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="foto">Foto (JPG/PNG, maks 2MB)</label>
                        <div id="foto-lama" class="mb-2"></div>
                        <input type="file" class="form-control" id="foto" name="foto" accept="image/png,image/jpeg">
                        <div class="invalid-feedback"></div>
                        <img id="preview" class="img-thumbnail mt-2" alt="" hidden style="max-height: 120px">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="tombol">Simpan</button>
                        <a href="dashboard.html" class="btn btn-outline-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/form.js"></script>
</body>
</html>
