<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5 col-lg-4">
                <div class="card kartu">
                    <div class="card-body p-4">
                        <h4 class="mb-1">Login</h4>
                        <p class="text-secondary">Sistem Informasi Akademik</p>

                        <div id="pesan"></div>

                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input type="text" class="form-control" id="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="tombol">Masuk</button>
                        </form>

                        <p class="text-secondary small mt-3 mb-0">
                            Akun uji: <code>admin</code> / <code>rahasia123</code> (admin),
                            <code>budi</code> / <code>user12345</code> (user)
                        </p>
                        <a href="index.html" class="small">Lihat data tanpa login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
