<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">Sistem Informasi Akademik</span>
            <a href="login.html" class="btn btn-light btn-sm">Login</a>
        </div>
    </nav>

    <main class="container my-4">
        <div class="card kartu">
            <div class="card-body">
                <h4 class="mb-3">Daftar Mahasiswa</h4>

                <!-- Loading indicator -->
                <div id="loading" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <div class="text-secondary mt-2">Memuat data...</div>
                </div>

                <div id="pesan"></div>

                <div class="table-responsive">
                    <table class="table table-striped align-middle" id="tabel" hidden>
                        <thead class="table-dark">
                            <tr><th>No</th><th>NIM</th><th>Nama</th><th>Prodi</th><th>Dibuat</th></tr>
                        </thead>
                        <tbody id="isi-tabel"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Mengambil data dari API lalu menampilkannya dalam tabel
        async function muatMahasiswa() {
            const loading = document.getElementById('loading');
            const pesan   = document.getElementById('pesan');
            const tabel   = document.getElementById('tabel');
            const isi     = document.getElementById('isi-tabel');

            loading.hidden = false;
            pesan.innerHTML = '';
            tabel.hidden = true;

            const hasil = await apiRequest('GET', '/mahasiswa');
            loading.hidden = true;

            if (!hasil.ok) {
                pesan.innerHTML = htmlGagalMuat('Gagal memuat data: ' + hasil.json.message, 'muatMahasiswa');
                return;
            }

            const data = hasil.json.data;

            // Tugas mandiri: pesan jika data kosong
            if (data.length === 0) {
                pesan.innerHTML = '<div class="alert alert-secondary text-center">Belum ada data mahasiswa.</div>';
                return;
            }

            isi.innerHTML = data.map(function (m, i) {
                return '<tr>' +
                    '<td>' + (i + 1) + '</td>' +
                    '<td>' + escapeHtml(m.nim) + '</td>' +
                    '<td>' + escapeHtml(m.nama) + '</td>' +
                    '<td>' + escapeHtml(m.prodi) + '</td>' +
                    '<td>' + escapeHtml(m.created_at) + '</td>' +
                    '</tr>';
            }).join('');
            tabel.hidden = false;
        }

        muatMahasiswa();
    </script>
</body>
</html>
