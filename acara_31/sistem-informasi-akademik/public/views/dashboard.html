<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Sistem Informasi Akademik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold">Sistem Informasi Akademik</span>
            <div class="d-flex align-items-center gap-2 text-white">
                <span id="info-user" class="small"></span>
                <button class="btn btn-light btn-sm" id="tombol-logout">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h4 class="mb-3">Dashboard</h4>

        <!-- Ringkasan dari GET /mahasiswa/summary -->
        <div class="row g-3 mb-4" id="ringkasan"></div>

        <div class="card kartu">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Data Mahasiswa</h5>
                    <a href="form_tambah.html" class="btn btn-success btn-sm">+ Tambah Mahasiswa</a>
                </div>

                <div id="loading" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <div class="text-secondary mt-2">Memuat data...</div>
                </div>
                <div id="pesan"></div>

                <div class="table-responsive">
                    <table class="table table-striped align-middle" id="tabel" hidden>
                        <thead class="table-dark">
                            <tr><th>No</th><th>Foto</th><th>NIM</th><th>Nama</th><th>Prodi</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="isi-tabel"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
